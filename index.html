<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KioraTech — Launching Platform...</title>
  <meta http-equiv="refresh" content="0; url=public/index.html">
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Opening KioraTech Website...</h2>
  <p>If not redirected automatically, <a href="http://localhost:5000">Click Here for Live Server (localhost:5000)</a> or <a href="public/index.html">Click Here for Local View</a>.</p>
  <script>
    fetch('http://localhost:5000/api/settings')
      .then(res => {
        if (res.ok) {
          window.location.href = 'http://localhost:5000';
        } else {
          window.location.href = 'public/index.html';
        }
      })
      .catch(() => {
        window.location.href = 'public/index.html';
      });
  </script>
</body>
</html>
